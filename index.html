<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3A7BF9" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <title>课表 · Timetable</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="课表" />

  <!-- Tailwind CSS（CDN 引入） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#3A7BF9" },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-gray-50 text-gray-800 overflow-x-hidden">

  <!-- ======================= 桌面端固定侧边栏 ======================= -->
  <aside id="sidebar" class="hidden lg:flex fixed left-0 top-0 bottom-0 flex-col bg-white border-r border-gray-200 z-30" style="width: var(--sidebar-w)">
    <div class="px-6 py-6 border-b border-gray-100 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-primary flex items-center gap-2">📅 <span data-i18n="app_title">课表</span></h1>
        <p class="text-xs text-gray-400 mt-1" data-i18n="app_subtitle">Timetable · 实时同步</p>
      </div>
      <button id="lang-toggle" class="lang-btn" title="中文 / English">EN</button>
    </div>

    <div class="px-6 py-4">
      <label class="text-xs text-gray-500 font-medium" data-i18n="current_semester">当前学期</label>
      <select id="semester-select" class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"></select>
    </div>

    <div class="px-6 space-y-2">
      <button id="btn-add" class="w-full rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="add_course">＋ 添加课程</button>
      <button id="btn-unlock" class="w-full rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition hidden" data-i18n="unlock_edit">🔒 解锁编辑</button>
      <button id="btn-manage-semesters" class="w-full rounded-lg border border-gray-200 bg-white py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition" data-i18n="manage_semesters">学期管理</button>
      <button id="btn-lock" class="w-full rounded-lg border border-gray-200 bg-white py-2 text-xs font-medium text-gray-500 hover:bg-gray-50 transition hidden" data-i18n="lock_edit">锁定编辑</button>
    </div>

    <div class="px-6 mt-4 flex-1 overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs text-gray-500 font-medium" data-i18n="todo_title">📝 待办</p>
        <button id="btn-add-todo" class="text-xs text-primary font-medium hidden" data-i18n="add_todo_btn">＋ 添加</button>
      </div>
      <div id="todo-list" class="space-y-1.5 mb-5"></div>

      <p class="text-xs text-gray-500 font-medium mb-2" data-i18n="section_ref">节次参考</p>
      <div id="section-times" class="text-xs text-gray-400 space-y-1"></div>
    </div>

    <div class="px-6 py-4 border-t border-gray-100 flex items-center gap-2 text-xs text-gray-400">
      <span id="sync-dot" class="w-2 h-2 rounded-full bg-gray-300"></span>
      <span id="sync-text">连接中…</span>
    </div>

    <!-- 侧边栏宽度拖拽分隔条 -->
    <div id="sidebar-resizer" title="拖动调整侧边栏宽度"></div>
  </aside>

  <!-- ======================= 主区域 ======================= -->
  <div class="main-content flex flex-col min-h-screen">

    <!-- 移动端顶部栏 -->
    <header class="lg:hidden sticky top-0 z-30 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold text-primary">📅 <span data-i18n="app_title">课表</span></h1>
      <div class="flex items-center gap-2">
        <button id="lang-toggle-mobile" class="lang-btn">EN</button>
        <select id="semester-select-mobile" class="rounded-lg border border-gray-200 px-2 py-1.5 text-sm focus:outline-none"></select>
      </div>
    </header>

    <main class="flex-1 p-4 lg:p-6">

      <!-- 桌面端周视图 -->
      <section id="desktop-view" class="hidden lg:block">
        <div class="flex items-center justify-between mb-4">
          <h2 id="desktop-semester-title" class="text-lg font-semibold">课表</h2>
          <span id="desktop-week-hint" class="text-xs text-gray-400"></span>
        </div>
        <div class="relative">
          <div class="overflow-auto rounded-xl border border-gray-200 bg-white shadow-sm max-h-[calc(100vh-8rem)]">
            <div id="day-header" class="grid sticky top-0 bg-gray-50 border-b border-gray-200 z-10"></div>
            <div id="desktop-grid" class="relative"></div>
          </div>
          <!-- 课表列宽拖拽手柄 -->
          <div id="grid-resize-handle" class="grid-resize-handle" title="拖动调整列宽"></div>
        </div>
      </section>

      <!-- 移动端按星期分组的纵向列表 -->
      <section id="mobile-view" class="lg:hidden pb-24">
        <div id="mobile-list"></div>
      </section>

      <!-- 移动端待办视图 -->
      <section id="mobile-todos-view" class="lg:hidden pb-24 hidden">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-sm" data-i18n="todo_title">📝 待办</h2>
          <button id="mobile-add-todo" class="text-xs text-primary font-medium">＋ 添加</button>
        </div>
        <div id="mobile-todo-list" class="space-y-2"></div>
      </section>
    </main>
  </div>

  <!-- ======================= 移动端底部导航 ======================= -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 flex shadow-[0_-2px_8px_rgba(0,0,0,0.04)]">
    <button id="nav-timetable" class="nav-btn flex-1 py-3 text-xs flex flex-col items-center gap-1 active text-primary">
      <span class="text-lg leading-none">📋</span><span data-i18n="nav_timetable">课表</span>
    </button>
    <button id="nav-add" class="nav-btn flex-1 py-3 text-xs flex flex-col items-center gap-1 text-gray-400">
      <span class="text-lg leading-none">＋</span><span data-i18n="nav_add">添加</span>
    </button>
    <button id="nav-todos" class="nav-btn flex-1 py-3 text-xs flex flex-col items-center gap-1 text-gray-400">
      <span class="text-lg leading-none">📝</span><span data-i18n="nav_todos">待办</span>
    </button>
    <button id="nav-semesters" class="nav-btn flex-1 py-3 text-xs flex flex-col items-center gap-1 text-gray-400">
      <span class="text-lg leading-none">🗓️</span><span data-i18n="nav_semesters">学期</span>
    </button>
  </nav>

  <!-- ======================= 课程详情弹窗 ======================= -->
  <div id="modal-detail" class="modal hidden">
    <div class="modal-mask" data-close="modal-detail"></div>
    <div class="modal-panel">
      <div class="flex items-start justify-between">
        <h3 id="detail-name" class="text-lg font-bold text-gray-900"></h3>
        <button class="modal-close" data-close="modal-detail" aria-label="关闭">✕</button>
      </div>
      <div id="detail-body" class="mt-4 space-y-3 text-sm"></div>
      <div id="detail-actions" class="mt-6 flex gap-3">
        <button id="btn-edit-course" class="flex-1 rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="detail_edit">编辑</button>
        <button id="btn-delete-course" class="flex-1 rounded-lg border border-red-200 text-red-500 py-2.5 text-sm font-medium hover:bg-red-50 transition" data-i18n="detail_delete">删除</button>
      </div>
      <div id="detail-lock-hint" class="mt-6 hidden">
        <button id="btn-unlock-from-detail" class="w-full rounded-lg bg-gray-100 text-gray-600 py-2.5 text-sm font-medium hover:bg-gray-200 transition" data-i18n="detail_unlock_hint">🔒 解锁后即可编辑 / 删除</button>
      </div>
    </div>
  </div>

  <!-- ======================= 课程编辑弹窗（新增/修改共用） ======================= -->
  <div id="modal-edit" class="modal hidden">
    <div class="modal-mask" data-close="modal-edit"></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between">
        <h3 id="edit-title" class="text-lg font-bold text-gray-900">添加课程</h3>
        <button class="modal-close" data-close="modal-edit" aria-label="关闭">✕</button>
      </div>

      <form id="course-form" class="mt-4 space-y-3 text-sm">
        <div>
          <label class="form-label"><span data-i18n="label_name">课程名</span> <span class="text-red-500">*</span></label>
          <input id="f-name" type="text" required placeholder="如：高等数学" class="form-input" data-i18n-ph="ph_name" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label" data-i18n="label_teacher">教师</label>
            <input id="f-teacher" type="text" placeholder="如：张老师" class="form-input" data-i18n-ph="ph_teacher" />
          </div>
          <div>
            <label class="form-label" data-i18n="label_location">教室</label>
            <input id="f-location" type="text" placeholder="如：教学楼A-101" class="form-input" data-i18n-ph="ph_location" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="form-label"><span data-i18n="label_weekday">星期</span> <span class="text-red-500">*</span></label>
            <select id="f-weekday" class="form-input"></select>
          </div>
          <div>
            <label class="form-label"><span data-i18n="label_start">开始节次</span> <span class="text-red-500">*</span></label>
            <select id="f-start" class="form-input"></select>
          </div>
          <div>
            <label class="form-label"><span data-i18n="label_end">结束节次</span> <span class="text-red-500">*</span></label>
            <select id="f-end" class="form-input"></select>
          </div>
        </div>

        <div>
          <label class="form-label" data-i18n="label_weeks">周次</label>
          <input id="f-weeks" type="text" placeholder="如 1-16周 / 1-16周(单) / 1,3,5周；留空为全学期" class="form-input" data-i18n-ph="ph_weeks" />
        </div>

        <div>
          <label class="form-label" data-i18n="label_note">备注</label>
          <textarea id="f-note" rows="2" placeholder="备注信息（可选）" class="form-input resize-none" data-i18n-ph="ph_note"></textarea>
        </div>

        <div id="conflict-tip" class="hidden rounded-lg bg-red-50 border border-red-200 text-red-600 px-3 py-2 text-xs"></div>

        <label class="flex items-center gap-2 text-xs text-gray-500">
          <input type="checkbox" id="f-ignore-conflict" class="rounded border-gray-300" />
          <span data-i18n="ignore_conflict">忽略冲突，仍要保存</span>
        </label>

        <div class="flex gap-3 pt-1">
          <button type="submit" id="btn-save-course" class="flex-1 rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="save">保存</button>
          <button type="button" id="btn-cancel-edit" class="flex-1 rounded-lg border border-gray-200 bg-white py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition" data-i18n="cancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ======================= 学期管理弹窗 ======================= -->
  <div id="modal-semesters" class="modal hidden">
    <div class="modal-mask" data-close="modal-semesters"></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-gray-900" data-i18n="semester_title">学期管理</h3>
        <button class="modal-close" data-close="modal-semesters" aria-label="关闭">✕</button>
      </div>

      <div class="mt-4">
        <p class="text-xs text-gray-500 font-medium mb-2" data-i18n="existing_semesters">已有学期（点击可切换）</p>
        <div id="semester-list" class="space-y-2 max-h-56 overflow-y-auto"></div>
      </div>

      <div class="mt-5 border-t border-gray-100 pt-4">
        <p class="text-xs text-gray-500 font-medium mb-2" data-i18n="new_semester">新建学期</p>
        <div class="flex gap-2">
          <input id="new-semester-name" type="text" placeholder="如：2025-2026学年第一学期" class="form-input flex-1" data-i18n-ph="ph_semester_name" />
          <input id="new-semester-date" type="date" class="form-input w-36" title="开学日期（可选）" />
        </div>
        <button id="btn-create-semester" class="mt-3 w-full rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="create_semester">创建学期</button>
      </div>
    </div>
  </div>

  <!-- ======================= 添加待办弹窗 ======================= -->
  <div id="modal-todo" class="modal hidden">
    <div class="modal-mask" data-close="modal-todo"></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between">
        <h3 id="todo-modal-title" class="text-lg font-bold text-gray-900">添加待办</h3>
        <button class="modal-close" data-close="modal-todo" aria-label="关闭">✕</button>
      </div>

      <div class="mt-4 space-y-3">
        <div>
          <label class="form-label"><span data-i18n="label_content">内容</span> <span class="text-red-500">*</span></label>
          <input id="todo-f-content" type="text" placeholder="如：完成高数作业第3章" class="form-input" data-i18n-ph="ph_content" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label" data-i18n="label_due">截止日期（可选）</label>
            <input id="todo-f-due" type="date" class="form-input" />
          </div>
          <div>
            <label class="form-label" data-i18n="label_course">关联课程（可选）</label>
            <select id="todo-f-course" class="form-input"></select>
          </div>
        </div>
        <label class="flex items-center gap-2 text-xs text-gray-500">
          <input type="checkbox" id="todo-f-recurring" class="rounded border-gray-300" />
          <span data-i18n="recurring_label">🔁 循环任务（每天自动刷新为未完成）</span>
        </label>
        <div class="flex gap-3 pt-1">
          <button id="btn-save-todo" class="flex-1 rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="save">保存</button>
          <button data-close="modal-todo" class="flex-1 rounded-lg border border-gray-200 bg-white py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition" data-i18n="cancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= 解锁编辑弹窗 ======================= -->
  <div id="modal-unlock" class="modal hidden">
    <div class="modal-mask" data-close="modal-unlock"></div>
    <div class="modal-panel">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-gray-900" data-i18n="unlock_title">🔒 解锁编辑</h3>
        <button class="modal-close" data-close="modal-unlock" aria-label="关闭">✕</button>
      </div>
      <p class="text-xs text-gray-500 mt-2" data-i18n="unlock_desc">当前为访客只读模式，输入编辑口令后才能添加 / 修改 / 删除课程。</p>
      <input id="unlock-password" type="password" placeholder="请输入编辑口令" class="form-input mt-4" autocomplete="off" data-i18n-ph="ph_password" />
      <div class="flex gap-3 mt-4">
        <button id="btn-unlock-confirm" class="flex-1 rounded-lg bg-primary text-white py-2.5 text-sm font-medium hover:bg-[#2f6be0] transition" data-i18n="unlock">解锁</button>
        <button data-close="modal-unlock" class="flex-1 rounded-lg border border-gray-200 bg-white py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-50 transition" data-i18n="cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ======================= Toast 提示 ======================= -->
  <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg whitespace-nowrap"></div>

  <!-- Supabase JS 客户端（CDN 引入） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
