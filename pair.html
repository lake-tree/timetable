<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3A7BF9" />
  <title>绑定墨水屏 · 课表</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --primary: #3A7BF9;
      --text: #1a1d21;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f5f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 26px 22px 24px;
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.08);
    }
    h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .code {
      font: 700 26px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 3px;
      text-align: center;
      padding: 14px 10px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      margin: 0 0 20px;
      word-break: break-all;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58, 123, 249, 0.14); }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; }
    button.ghost {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--line);
      margin-top: 10px;
    }
    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      word-break: break-all;
    }
    .account strong { font-weight: 600; }
    .msg { margin-top: 14px; font-size: 14px; min-height: 22px; }
    .msg.err { color: #d92d20; }
    .msg.ok { color: #067647; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 16px; }
    .done { text-align: center; padding: 8px 0 4px; }
    .done .tick {
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(6, 118, 71, 0.1); color: #067647;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>绑定墨水屏</h1>
    <p class="sub" id="sub">确认后，设备将显示你当前账户的课表与待办。</p>
    <p class="code" id="codeLabel">—</p>
    <div id="step"></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const cfg = window.APP_CONFIG || {};
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').trim().toUpperCase();

    const stepEl = document.getElementById('step');
    const msgEl = document.getElementById('msg');
    const codeEl = document.getElementById('codeLabel');
    const subEl = document.getElementById('sub');

    let session = null;

    function setMsg(text, kind) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (kind ? ' ' + kind : '');
    }

    function boot() {
      if (!code || code.length < 6) {
        codeEl.classList.add('hidden');
        stepEl.innerHTML = '<p class="sub">链接里没有配对码，请重新扫描设备上的二维码。</p>';
        return;
      }
      codeEl.textContent = code.slice(0, 4) + ' ' + code.slice(4);
      sb.auth.getSession().then(({ data }) => {
        session = (data && data.session) || null;
        render();
      });
    }

    function render() {
      if (!session) {
        renderLogin();
      } else {
        renderConfirm();
      }
    }

    function renderLogin() {
      subEl.textContent = '扫码成功。请先登录，再确认把该账户绑定到设备。';
      stepEl.innerHTML = `
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
        <label for="pwd">密码</label>
        <input id="pwd" type="password" autocomplete="current-password" placeholder="账户密码" />
        <button id="btnLogin">登录并继续</button>
        <p class="hint">登录状态与课表网页共用，登录后回到这个页面继续即可。</p>
      `;
      const btn = document.getElementById('btnLogin');
      btn.onclick = async () => {
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('pwd').value;
        if (!email || !pwd) {
          setMsg('请填写邮箱和密码', 'err');
          return;
        }
        btn.disabled = true;
        setMsg('正在登录…');
        const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
        btn.disabled = false;
        if (error) {
          setMsg('登录失败：' + error.message, 'err');
          return;
        }
        const { data } = await sb.auth.getSession();
        session = (data && data.session) || null;
        setMsg('');
        render();
      };
    }

    function renderConfirm() {
      const email = (session.user && session.user.email) || '当前账户';
      subEl.textContent = '确认后，设备将显示下面的账户的课表与待办。';
      stepEl.innerHTML = `
        <div class="account"><span>将绑定</span><strong>${escapeHtml(email)}</strong></div>
        <button id="btnApprove">确认绑定</button>
        <button id="btnSwitch" class="ghost">换一个账户登录</button>
      `;
      document.getElementById('btnApprove').onclick = approve;
      document.getElementById('btnSwitch').onclick = async () => {
        await sb.auth.signOut();
        session = null;
        renderLogin();
      };
    }

    async function approve() {
      const btn = document.getElementById('btnApprove');
      btn.disabled = true;
      setMsg('正在绑定…');

      // 关键：把当前会话的 refresh_token 交给设备，设备用它换 access_token，
      // 之后所有请求都以这个账户的身份发出（RLS 按 auth.uid() 生效）。
      const { error } = await sb.rpc('approve_device_pairing', {
        p_code: code,
        p_refresh_token: session.refresh_token,
        p_device_label: 'OnePage',
      });

      if (error) {
        btn.disabled = false;
        setMsg('绑定失败：' + error.message, 'err');
        return;
      }

      codeEl.classList.add('hidden');
      subEl.classList.add('hidden');
      stepEl.innerHTML = `
        <div class="done">
          <div class="tick">✓</div>
          <h1>绑定成功</h1>
          <p class="sub">回到墨水屏，几秒内会自动显示你的课表。</p>
        </div>
      `;
      setMsg('');
      // 清掉地址栏里的配对码，避免刷新页面重复提交
      history.replaceState(null, '', location.pathname);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    boot();
  </script>
</body>
</html>
